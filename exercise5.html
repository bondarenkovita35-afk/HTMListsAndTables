<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Exercise 5</title>
</head>
<body>

    <h2>Products Table</h2>

    <!-- Table with thead, tbody and tfoot -->
    <table border="1">

        <thead>
            <tr>
                <th>Product</th>
                <th>Price (kr)</th>
            </tr>
        </thead>

        <tbody>
            <tr>
                <td>Bread</td>
                <td>20</td>
            </tr>
            <tr>
                <td>Milk</td>
                <td>15</td>
            </tr>
        </tbody>

        <tfoot>
            <tr>
                <td>Total</td>
                <td>35</td>
            </tr>
        </tfoot>

    </table>

</body>
</html>
