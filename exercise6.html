<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Exercise 6</title>
</head>
<body>

    <h2>Colspan Example</h2>

    <!-- Table with colspan -->
    <table border="1">
        <tr>
            <th>Month</th>
            <th>Savings</th>
            <th>Extra</th>
        </tr>

        <tr>
            <td>January</td>
            <td>100 kr</td>
            <td>50 kr</td>
        </tr>

        <tr>
            <td>February</td>
            <td>80 kr</td>
            <td>20 kr</td>
        </tr>

        <!-- Colspan merges 3 columns -->
        <tr>
            <td colspan="3">Total: 250 kr</td>
        </tr>
    </table>

</body>
</html>
